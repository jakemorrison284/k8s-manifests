# Baseline Security Policies Manifesto

# This file maintains the baseline security policies for Kubernetes manifests

securityPolicies:
  podSecurity:
    enforce: "restricted"
    exemptNamespaces:
      - kube-system
      - kube-public
    runtimeSecurity:
      seccompProfile: "runtime/default"
      appArmorProfile: "runtime/default"
    containerCapabilities:
      dropAll: true
      add: []
  networkPolicies:
    defaultDeny:
      ingress: true
      egress: true
    namespaceIsolation: true
    workloadSpecificRules: true
  resourceLimits:
    cpu:
      request: "250m"
      limit: "500m"
    memory:
      request: "128Mi"
      limit: "256Mi"
    ephemeralStorage:
      request: "1Gi"
      limit: "2Gi"
  imageSecurity:
    requireSignedImages: true
    disallowLatestTag: true
    enableVulnerabilityScanning: true
    allowedRegistries:
      - mytrustedregistry.com
    enforceDigestUsage: true
  secretsManagement:
    enforceEncryptionAtRest: true
    restrictAccessToSecrets: true
  auditing:
    enableAuditLogging: true
    auditLogRetentionDays: 30
  availability:
    podDisruptionBudget:
      minAvailable: 1
    replicaCount:
      min: 2
  admissionControllers:
    enableOPA: true
    enableGatekeeper: true
  loggingMonitoring:
    enableSecurityEventLogging: true
    integrateWithSIEM: true

# Add additional policies as needed
