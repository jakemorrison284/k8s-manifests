# Baseline Security Policies Manifesto

# This file maintains the baseline security policies for Kubernetes manifests

securityPolicies:
  podSecurity:
    enforce: "restricted"
    exemptNamespaces:
      - kube-system
      - kube-public
  networkPolicies:
    defaultDeny:
      ingress: true
      egress: true
  resourceLimits:
    cpu:
      request: "250m"
      limit: "500m"
    memory:
      request: "128Mi"
      limit: "256Mi"
    ephemeralStorage:
      request: "1Gi"
      limit: "2Gi"
  imageSecurity:
    requireSignedImages: true
    disallowLatestTag: true
    enableVulnerabilityScanning: true
    allowedRegistries:
      - mytrustedregistry.com
    enforceDigestUsage: true
  secretsManagement:
    enforceEncryptionAtRest: true
    restrictAccessToSecrets: true
  auditing:
    enableAuditLogging: true
    auditLogRetentionDays: 30

# Add additional policies as needed
