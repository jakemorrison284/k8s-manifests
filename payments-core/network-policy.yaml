apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payments-core-to-redis
  namespace: novapay
spec:
  podSelector:
    matchLabels:
      app: payments-core
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: payments-core
    ports:
    - protocol: TCP
      port: 6379 # Assuming Redis runs on port 6379
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: some-external-service  # Replace with actual service labels
    ports:
    - protocol: TCP
      port: <service-port>  # Specify appropriate service port

---

# Additional Network Policy

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-core-network-policy
  namespace: novapay
spec:
  podSelector:
    matchLabels:
      app: payments-core
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: some-allowed-service  # Replace with actual service labels
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: allowed-external-service  # Replace with actual service labels
