apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payments-core-network-policy
  namespace: novapay
spec:
  podSelector:
    matchLabels:
      app: payments-core
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: allowed-service  # Specify actual allowed services
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: allowed-external-service  # Specify actual allowed external services
    ports:
    - protocol: TCP
      port: 6379  # Redis port, or adjust as necessary
