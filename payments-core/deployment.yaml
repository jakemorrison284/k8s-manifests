apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-core
  namespace: novapay
spec:
  replicas: 3  # Consider changing to HPA for dynamic scaling
  selector:
    matchLabels:
      app: payments-core
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
      - name: payments-core
        image: internal-mirror/novapay/payments-core:v1.3.1
        ports:
        - containerPort: 8080
        env:
        - name: IDEMPOTENCY_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: redis-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"  # Adjust according to monitoring data
            cpu: "500m"
            ephemeral-storage: "1Gi"  # Added ephemeral storage request
          limits:
            memory: "2Gi"
            cpu: "1"
            ephemeral-storage: "2Gi"  # Added ephemeral storage limit
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5  # Added timeout
          failureThreshold: 3  # Added failure threshold
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5  # Added timeout
          failureThreshold: 3  # Added failure threshold
