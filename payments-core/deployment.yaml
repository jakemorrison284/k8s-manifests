apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-core
  namespace: novapay
spec:
  replicas: 5  # Increased replicas for better scalability and availability
  selector:
    matchLabels:
      app: payments-core
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
      - name: payments-core
        image: internal-mirror/novapay/payments-core:v1.3.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: IDEMPOTENCY_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: redis-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: database-url
        resources:
          requests:
            memory: "1.2Gi"  # Adjusted request for memory based on typical load
            cpu: "600m"  # Adjusted request for CPU
            ephemeral-storage: "1Gi"  # Request for ephemeral storage
          limits:
            memory: "1.8Gi"  # Adjusted limit for memory to allow some burst
            cpu: "1200m"  # Adjusted limit for CPU to allow burst capacity
            ephemeral-storage: "2Gi"  # Limit for ephemeral storage
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          failureThreshold: 30
          periodSeconds: 10
      # Optional readiness gates example (uncomment and customize if needed)
      # readinessGates:
      # - conditionType: CustomCondition
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: payments-core-pdb
  namespace: novapay
spec:
  minAvailable: 4  # Maintain at least 4 pods available during disruptions
  selector:
    matchLabels:
      app: payments-core
