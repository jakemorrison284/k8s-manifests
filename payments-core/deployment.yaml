apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-core-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payments-core
  template:
    metadata:
      labels:
        app: payments-core
    spec:
      containers:
      - name: payments-core
        image: payments-core:latest
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
