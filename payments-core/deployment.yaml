apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-core
  namespace: novapay
spec:
  replicas: 3  # Maintain replicas for availability
  selector:
    matchLabels:
      app: payments-core
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
      - name: payments-core
        image: internal-mirror/novapay/payments-core:v1.3.1
        ports:
        - containerPort: 8080
        env:
        - name: IDEMPOTENCY_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: redis-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"  # Increased request for memory to better reflect average load
            cpu: "500m"  # Increased request for CPU
          limits:
            memory: "2Gi"  # Increased limit for memory to handle spikes
            cpu: "1"  # Increased limit for CPU to allow burst capacity
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 30  # Optimized
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 10  # Optimized
          periodSeconds: 10
