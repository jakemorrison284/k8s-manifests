apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-core
  namespace: novapay
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payments-core
  template:
    spec:
      containers:
      - name: payments-core
        image: novapay/payments-core:v1.1.0
        ports:
        - containerPort: 8080
        env:
        - name: IDEMPOTENCY_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: redis-url
        resources:
          requests:
            memory: "400Mi"
            cpu: "300m"
          limits:
            memory: "800Mi"
            cpu: "400m"
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
