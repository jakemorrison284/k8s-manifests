apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-core
  namespace: novapay
spec:
  replicas: 3  # Adjusted replicas for performance
  selector:
    matchLabels:
      app: payments-core
  template:
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
      - name: payments-core
        image: novapay/payments-core:v1.3.0
        ports:
        - containerPort: 8080
        env:
        - name: IDEMPOTENCY_REDIS_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: redis-url
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: novapay-secrets
              key: database-url
        resources:
          requests:
            memory: "1Gi"  # Example target request for memory
            cpu: "500m"  # Example target request for CPU
          limits:
            memory: "2Gi"  # Example target limit for memory
            cpu: "1"  # Example target limit for CPU
        livenessProbe:
          httpGet:
            path: /health/liveness
            port: 8080
          initialDelaySeconds: 30  # Optimized
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 8080
          initialDelaySeconds: 10  # Optimized
          periodSeconds: 10
