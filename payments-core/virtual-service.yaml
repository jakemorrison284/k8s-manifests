apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: payments-core
  namespace: novapay
spec:
  hosts:
  - novapay/payments-core
  http:
  - route:
    - destination:
        host: novapay/payments-core
        port:
          number: 8080
      weight: 80
    - destination:
        host: novapay/payments-core-canary
        port:
          number: 8080
      weight: 20
      timeout: 5s
      retries:
        attempts: 3
        perTryTimeout: 2s