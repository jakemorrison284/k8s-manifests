apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: payments-core
  namespace: novapay
spec:
  hosts:
  - novapay/payments-core
  http:
  - route:
    - destination:
        host: novapay/payments-core
        port:
          number: 8080
      weight: 80
    - destination:
        host: novapay/payments-core-canary
        port:
          number: 8080
      weight: 20
    timeout: 20s  # Adjusted timeout for realistic service latency
    retries:
      attempts: 3  # Increased retry attempts with caution
      perTryTimeout: 5s
      retryOn: gateway-error,connect-failure,refused-stream
