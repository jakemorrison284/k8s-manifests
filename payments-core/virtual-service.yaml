apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: payments-core
  namespace: novapay
spec:
  hosts:
  - novapay/payments-core
  http:
  - route:
    - destination:
        host: novapay/payments-core
        port:
          number: 8080
      weight: 90
    - destination:
        host: novapay/payments-core-canary
        port:
          number: 8080
      weight: 10
    timeout: 15s
    retries:
      attempts: 1              # Reduced retry attempts to minimize duplicate side effects
      perTryTimeout: 2s        # Slightly reduced per try timeout for faster failure detection
      retryOn: gateway-error,connect-failure,refused-stream
