apiVersion: v1
kind: Service
metadata:
  name: payments-core-service
  namespace: novapay
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"  # Example for AWS NLB
spec:
  selector:
    app: payments-core
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP