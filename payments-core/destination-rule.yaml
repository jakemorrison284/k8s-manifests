apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payments-core-cb
  namespace: novapay
spec:
  host: novapay/payments-core
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL  # Enable mTLS
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutiveErrors: 3  # Lowered threshold for faster ejection
      interval: 5s       # Increased checking frequency
      baseEjectionTime: 60s  # Increased ejection duration
      maxEjectionPercent: 50
