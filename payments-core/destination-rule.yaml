apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payments-core-cb
  namespace: novapay
spec:
  host: novapay/payments-core
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL  # Enable mTLS
    connectionPool:
      tcp:
        maxConnections: 150  # Increased max connections based on traffic considerations
      http:
        http1MaxPendingRequests: 75  # Increased pending requests
        maxRequestsPerConnection: 150  # Increased max requests per connection
    outlierDetection:
      consecutiveErrors: 5  # Raised threshold to reduce false positives
      interval: 10s       # Increased interval to reduce control plane load
      baseEjectionTime: 90s  # Increased ejection duration
      maxEjectionPercent: 50
