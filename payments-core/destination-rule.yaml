apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payments-core-circuit-breaker
  namespace: novapay
spec:
  host: novapay/payments-core
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 100
    outlierDetection:
      consecutiveErrors: 5
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
---
apiVersion: networking.istio.io/v1alpha3
kind: DestinationRule
metadata:
  name: payments-core-canary-circuit-breaker
  namespace: novapay
spec:
  host: novapay/payments-core-canary
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 50
      http:
        http1MaxPendingRequests: 25
        maxRequestsPerConnection: 50
    outlierDetection:
      consecutiveErrors: 3
      interval: 10s
      baseEjectionTime: 20s
      maxEjectionPercent: 25
